// KSPVk Enhanced mode: atmosphere and terrain overrides (Settings > Enhanced > Atmosphere / Terrain). Any mod can ship its own nodes.
//
// KSPVK_ATMO: the physically based sky and aerial perspective of a body. By default these come from the body itself: radius, atmosphere depth,
// sea-level pressure (density relative to Kerbin) and the scale height of its pressure curve. The sky colour uses Earth's Rayleigh coefficients,
// tinted by the body's stock 1 / wavelength^4 relative to Kerbin's.
//   body           = body name
//   density        = multiplier on both Rayleigh and Mie scattering
//   mie            = extra multiplier on Mie (haze) scattering
//   mieG           = haze forward-scattering asymmetry, 0 .. 0.95 (default 0.8)
//   scaleHeight    = Rayleigh scale height in metres (default: from the pressure curve)
//   mieScaleHeight = haze scale height in metres (default: 0.15 x scaleHeight)
//
// KSPVK_ATMO
// {
//     body = Duna
//     mie = 4
//     mieG = 0.7
// }
//
// KSPVK_TERRAIN: optional detail textures (2 m tiles) for a body's terrain bands, low to high (stock: low, mid, high; the alternative shader:
// deep, main, high, snow). Without an entry the detail layer is derived from each band's own near texture. Values are GameData texture URLs
// without the extension (KSP loads PNG / DDS / JPG from GameData at startup); the last entry repeats for the remaining bands. Normal maps are
// plain RGB tangent-space (not the _NRM swizzle). body = * applies to every body without its own node. No textures ship with KSPVk; CC0 sets
// (for example ambientCG) work well.
//
// KSPVK_TERRAIN
// {
//     body = Kerbin
//     albedo = MyTextures/Ground054_Color, MyTextures/Grass004_Color, MyTextures/Rock030_Color
//     normal = MyTextures/Ground054_NormalGL, MyTextures/Grass004_NormalGL, MyTextures/Rock030_NormalGL
// }
