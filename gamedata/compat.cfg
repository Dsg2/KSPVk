// KSPVk mod compatibility table. Any mod can ship its own KSPVK_COMPAT / KSPVK_EXCLUDE nodes; they are merged at load.
//   assembly = loaded assembly name (the DLL name without .dll)
//   unity    = what Unity keeps drawing while that mod is installed: objects, terrain, ocean, scaled, sun, atmosphere, galaxy
//   disable  = true turns KSPVk off entirely (the player can still turn it on in the KSPVk window)
// Entries below are from the mods' published releases and have not been tested with KSPVk yet.

KSPVK_COMPAT
{
	assembly = scatterer
	unity = ocean, atmosphere, sun, scaled
	note = Scatterer replaces atmosphere, ocean and sun rendering
}
KSPVK_COMPAT
{
	assembly = EVEManager
	unity = scaled
	note = EVE adds city lights and cloud shadows to the scaled planets; clouds stay in Unity
}
KSPVK_COMPAT
{
	assembly = Parallax
	unity = terrain
	note = Parallax replaces the terrain shader
}
KSPVK_COMPAT
{
	assembly = Deferred
	disable = true
	note = deferred rendering skips the forward pass KSPVk composites into
}
KSPVK_COMPAT
{
	assembly = Singularity
	unity = galaxy
	note = screen-space lensing reads the skybox
}
KSPVK_COMPAT
{
	assembly = TUFX
	note = post-processing runs on the final image; compatible
}
KSPVK_COMPAT
{
	assembly = Kopernicus
	note = custom bodies use stock shaders; unknown shaders stay in Unity
}
KSPVK_COMPAT
{
	assembly = Waterfall
	note = engine effects are transparent and stay in Unity
}
KSPVK_COMPAT
{
	assembly = TexturesUnlimited
	note = custom part shaders stay in Unity
}

// Shaders Unity always keeps drawing (exact name, or a prefix ending in *).
KSPVK_EXCLUDE
{
}
