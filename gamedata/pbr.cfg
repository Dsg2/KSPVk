// KSPVk Enhanced mode: per-part material overrides for the physically based shading (Settings > Enhanced > PBR parts).
// Without an entry, roughness and metalness are estimated per pixel from the stock material (_SpecColor, _Shininess, gloss in the texture alpha).
//   part      = part name as in its cfg (name = ...); a trailing * matches a prefix. The first matching node wins.
//   roughness = 0 (mirror) .. 1 (matte), optional
//   metal     = 0 (paint, plastic) .. 1 (bare metal), optional
// Any mod can ship its own KSPVK_PBR nodes. Example:
//
// KSPVK_PBR
// {
//     part = liquidEngine*
//     roughness = 0.35
//     metal = 1
// }
